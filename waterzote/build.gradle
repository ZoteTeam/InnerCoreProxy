plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.1.0"
    id 'maven-publish'
}

group = 'com.reider745.proxy.waterzote'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()

    maven {
        url "https://repo.opencollab.dev/maven-releases/"
    }

    maven {
        url "https://repo.opencollab.dev/maven-snapshots/"
    }

    maven {
        url "https://repo.waterdog.dev/main"
    }

    maven {
        name "innerCoreReposiliteSnapshots"
        url "https://maven.inner-core.org/snapshots"
    }
}

tasks.build {
    dependsOn(tasks.shadowJar)
}

dependencies {
    implementation(project(":common"))
    compileOnly "dev.waterdog.waterdogpe:waterzote:2.0.4-SNAPSHOT"

    compileOnly('org.projectlombok:lombok:1.18.42')
    annotationProcessor('org.projectlombok:lombok:1.18.42')
}

tasks.jar {
    archiveFileName.set("${project.name}-${project.version}.jar")
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "innerCoreReposiliteReleases"
            url = uri("https://maven.inner-core.org/releases")
            credentials {
                username = findProperty('innercoreUsername')?.toString() ?: System.getenv('MAVEN_USERNAME')
                password = findProperty('innercorePassword')?.toString() ?: System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}